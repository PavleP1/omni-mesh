name: Build OmniMesh Multi-Platform Suite

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-all-platforms:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: android-actions/setup-android@v3
        with:
          distribution: 'temurin'
          java-version: '11'

      # 1. BUILD JAVA ME S40 .JAR (Nokia 2700 classic) with proper package stubs
      - name: Compile Java ME MIDlet for Nokia 2700
        run: |
          echo "Creating build directories..."
          mkdir -p s40_build/stubs/javax/microedition/midlet \
                   s40_build/stubs/javax/microedition/lcdui \
                   s40_build/stubs/javax/microedition/io \
                   s40_build/stubs/javax/bluetooth \
                   s40_build/classes

          echo "Writing MIDlet stub..."
          cat << 'EOF' > s40_build/stubs/javax/microedition/midlet/MIDlet.java
          package javax.microedition.midlet;
          public abstract class MIDlet {
              public MIDlet() {}
              public abstract void startApp();
              public abstract void pauseApp();
              public abstract void destroyApp(boolean u);
              public final void notifyDestroyed() {}
          }
          EOF

          echo "Writing LCDUI stubs..."
          cat << 'EOF' > s40_build/stubs/javax/microedition/lcdui/Components.java
          package javax.microedition.lcdui;
          public interface CommandListener { void commandAction(Command c, Displayable d); }
          public interface Displayable {}
          public class Display {
              public static Display getDisplay(MIDlet m) { return null; }
              public void setCurrent(Displayable d) {}
          }
          public class Command {
              public static final int EXIT=0, SCREEN=1, OK=1, BACK=2, ITEM=1;
              public static final Command SELECT_COMMAND = new Command("Select", OK, 1);
              public Command(String l, int t, int p) {}
          }
          public class Screen implements Displayable {}
          public class Form extends Screen {
              public Form(String t) {}
              public void append(Object o) {}
              public void addCommand(Command c) {}
              public void setCommandListener(CommandListener l) {}
          }
          public class List extends Screen implements Displayable {
              public static final int IMPLICIT=0;
              public List(String t, int i) {}
              public int append(String s, java.awt.Image im) { return 0; }
              public int getSelectedIndex() { return 0; }
              public void addCommand(Command c) {}
              public void setCommandListener(CommandListener l) {}
          }
          public class Item {}
          public class StringItem extends Item {
              public StringItem(String l, String t) {}
              public void setText(String t) {}
              public String getText() { return ""; }
          }
          public class TextField extends Item {
              public static final int ANY=0;
              public TextField(String l, String t, int m, int c) {}
              public String getString() { return ""; }
              public void setString(String s) {}
          }
          EOF

          echo "Writing IO stubs..."
          cat << 'EOF' > s40_build/stubs/javax/microedition/io/IO.java
          package javax.microedition.io;
          import java.io.*;
          public interface Connection {}
          public interface StreamConnection extends Connection {
              InputStream openInputStream() throws IOException;
              OutputStream openOutputStream() throws IOException;
              void close() throws IOException;
          }
          public interface StreamConnectionNotifier extends Connection {
              StreamConnection acceptAndOpen() throws IOException;
              void close() throws IOException;
          }
          public class Connector {
              public static Connection open(String name) throws IOException { return null; }
          }
          EOF

          echo "Writing Bluetooth stubs..."
          cat << 'EOF' > s40_build/stubs/javax/bluetooth/Bluetooth.java
          package javax.bluetooth;
          import java.io.IOException;
          public class LocalDevice {
              public static LocalDevice getLocalDevice() throws BluetoothStateException { return null; }
              public DiscoveryAgent getDiscoveryAgent() { return null; }
              public void setDiscoverable(int mode) {}
              public String getFriendlyName() { return ""; }
          }
          public class DiscoveryAgent {
              public static final int GIAC=0;
              public void startInquiry(int accessCode, DiscoveryListener listener) {}
          }
          public interface DiscoveryListener {
              void deviceDiscovered(RemoteDevice btDevice, DeviceClass cod);
              void inquiryCompleted(int discType);
              void servicesDiscovered(int transID, ServiceRecord[] servRecord);
              void serviceSearchCompleted(int transID, int respCode);
          }
          public class RemoteDevice {
              public String getFriendlyName(boolean arg0) { return ""; }
              public String getBluetoothAddress() { return ""; }
              public String getConnectionURL(int arg0, boolean arg1) { return ""; }
          }
          public class DeviceClass {}
          public class ServiceRecord {}
          public class BluetoothStateException extends Exception {}
          EOF

          echo "Compiling stubs..."
          find s40_build/stubs -name "*.java" > s40_build/sources.txt
          javac -source 6 -target 6 -encoding UTF-8 -d s40_build/classes @s40_build/sources.txt
          
          echo "Compiling OmniMeshS40.java against stubs..."
          javac -source 6 -target 6 -encoding UTF-8 -cp s40_build/classes -d s40_build/classes s40/OmniMeshS40.java
          
          echo "Packaging into JAR archive..."
          cd s40_build/classes && jar cf ../../omni_nokia2700.jar *
          cd ../../
          echo "Successfully generated omni_nokia2700.jar"

      # 2. PACKAGE SYMBIAN ASSETS (Nokia E72)
      - name: Package Symbian Distribution Assets
        run: |
          mkdir -p symbian_build
          cp symbian/omnimesh.py symbian_build/
          cp symbian/omnimesh.pkg symbian_build/
          cd symbian_build && zip -r ../omnimesh_e72_package.zip omnimesh.py omnimesh.pkg
          cd ../
          echo "Successfully packaged Symbian files"

      # 3. BUILD ANDROID DEBUG APK
      - name: Grant execute permission for Gradle wrapper
        working-directory: ./android
        run: chmod +x gradlew || true

      - name: Build Android Debug APK
        working-directory: ./android
        run: ./gradlew assembleDebug

      # 4. COLLECT ALL ARTIFACTS INTO A UNIFIED RELEASE FOLDER
      - name: Assemble Final Release Artifacts
        run: |
          mkdir -p final_release
          cp omni_nokia2700.jar final_release/
          cp omnimesh_e72_package.zip final_release/
          find android/app/build/outputs/apk/debug/ -name "*.apk" -exec cp {} final_release/ \;
          echo "Release folder contents:"
          ls -la final_release/

      - name: Upload Artifacts to GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: omnimesh-crossplatform-binaries
          path: final_release/*
